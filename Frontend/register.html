<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register | University Course Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <div class="brand-mark"><b>U</b> University Course Portal</div>
    <div><h1>One account for every course.</h1><p>Register as a student to see the full list of courses on offer this term.</p></div>
    <small>CS-301L Full Stack Development</small>
  </aside>
  <main class="auth-main">
    <div class="auth-box">
      <h2>Create your account</h2>
      <p class="sub">It takes less than a minute.</p>
      <div id="msg" class="alert" role="alert"></div>
      <form id="regForm" novalidate>
        <label class="field"><span>Full name</span><input class="input" type="text" id="fullName" autocomplete="name" placeholder="Ayesha Khan"></label>
        <label class="field"><span>Email</span><input class="input" type="email" id="email" autocomplete="email" placeholder="you@university.edu"></label>
        <label class="field"><span>Password</span>
          <div class="pw-wrap"><input class="input" type="password" id="password" autocomplete="new-password" placeholder="At least 6 characters"><button type="button" class="pw-toggle">Show</button></div>
          <div class="meter"><i id="meterBar"></i></div><div class="hint" id="meterText">Use letters, numbers and symbols for a stronger password.</div>
        </label>
        <label class="field"><span>Confirm password</span><input class="input" type="password" id="confirm" autocomplete="new-password" placeholder="Re-enter your password"></label>
        <button class="btn" id="regBtn" type="submit">Create account</button>
      </form>
      <p class="swap">Already registered? <a href="index.html">Log in</a></p>
    </div>
  </main>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/api.js"></script>
<script src="js/register.js"></script>
</body>
</html>
