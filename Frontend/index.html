<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in | University Course Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div class="auth">
  <aside class="auth-side">
    <div class="brand-mark"><b>U</b> University Course Portal</div>
    <div><h1>Find your courses. Manage your term.</h1><p>Students browse every available course. Administrators keep the catalogue up to date.</p></div>
    <small>CS-301L Full Stack Development</small>
  </aside>
  <main class="auth-main">
    <div class="auth-box">
      <h2>Welcome back</h2>
      <p class="sub">Log in with your university email.</p>
      <div id="msg" class="alert" role="alert"></div>
      <form id="loginForm" novalidate>
        <label class="field"><span>Email</span><input class="input" type="email" id="email" autocomplete="email" placeholder="you@university.edu"></label>
        <label class="field"><span>Password</span>
          <div class="pw-wrap"><input class="input" type="password" id="password" autocomplete="current-password" placeholder="Your password"><button type="button" class="pw-toggle">Show</button></div>
        </label>
        <button class="btn" id="loginBtn" type="submit">Log in</button>
      </form>
      <p class="swap">New student? <a href="register.html">Create an account</a></p>
    </div>
  </main>
</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
